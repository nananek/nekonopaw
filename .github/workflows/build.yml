name: build
on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Install pipewire dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev pkg-config

      - name: go vet
        run: go vet ./...

      - name: go build (cgo with libpipewire)
        run: go build -v ./...

      - name: go test
        run: go test -v ./...
